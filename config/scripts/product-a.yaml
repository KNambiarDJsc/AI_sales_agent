# PLACEHOLDER SCRIPT — "product-a" (Amazon / online-selling lead qualification)
#
# This exists so the pipeline (state machine + LLM + qualification) has something
# concrete to run end-to-end. It is NOT the client's real script. Do not use it for
# real outbound calls. When the client provides their actual script, either replace
# this file's content or add a new versioned file (product-a.v2.yaml) — never edit
# Python orchestration code to change wording, questions, or thresholds.

script_id: product-a
version: 1
language: en-IN
# How the agent chooses the language it speaks:
#   fixed          — always `language`, whatever the customer speaks.
#   match_customer — start in `language`, then reply in whichever of
#                    `supported_languages` the customer is speaking (with en + hi this
#                    includes Hinglish), switching when they switch.
# match_customer requested by the project owner 2026-10-22. NOTE: an earlier client
# request asked for a single fixed language — PLACEHOLDER, confirm with the client.
language_policy: match_customer
supported_languages: [en-IN, hi-IN]

campaign:
  objective: "Amazon / online selling lead qualification"

# fallback_response: the fixed line the application speaks itself (invalid LLM output,
# timeouts, the DNC backstop). With language_policy match_customer it may hold one line
# per language (en / hi); the one matching the customer's language is used.
# Hindi wording is a PLACEHOLDER translation — client to confirm.
states:
  INTRO:
    objective: >
      Greet the person, confirm you're speaking with the right contact, and identify
      the business calling on behalf of.
    # Said the moment the call connects, without waiting for the LLM (it took 3-12 s
    # with the local model). Used only if every {field} is known for the lead —
    # otherwise the LLM writes the opening as before. Remove the line to always let
    # the LLM write it. PLACEHOLDER wording — client to confirm (incl. any identity
    # disclosure that must come first: system_prompt.yaml identity_disclosure).
    opening_line: "Hello, am I speaking with {contact_name} at {business_name}?"
    mandatory_questions:
      - "Confirm you're speaking with {contact_name} at {business_name}."
    allowed_tools: [end_call]
    fallback_response:
      en: "Sorry, could you tell me if this is {business_name}?"
      hi: "माफ़ कीजिए, क्या यह {business_name} है?"
    transitions_on:
      confirmed_identity: PERMISSION
      wrong_person: WRONG_NUMBER
      wrong_number: WRONG_NUMBER

  PERMISSION:
    objective: >
      Briefly explain the reason for the call (helping businesses sell their products
      on Amazon / online) and ask permission to continue.
    mandatory_questions:
      - "Is now an okay time for a quick two-minute call about selling your products online?"
    allowed_tools: [schedule_callback, mark_dnc, end_call]
    fallback_response:
      en: "No problem — would there be a better time to call back?"
      hi: "कोई बात नहीं — क्या किसी और समय कॉल करना ठीक रहेगा?"
    transitions_on:
      granted: DISCOVERY
      bad_time: CALLBACK
      declined: NOT_INTERESTED
      dnc_requested: DO_NOT_CALL

  DISCOVERY:
    objective: >
      Ask the primary qualification question: whether they're interested in selling
      their product on Amazon / online.
    mandatory_questions:
      - "Are you currently selling your products on Amazon or any online marketplace?"
      - "Would you be interested in exploring selling your product on Amazon / online?"
    allowed_tools: [update_lead, end_call]
    fallback_response:
      en: "Just to confirm — are you open to selling your product online?"
      hi: "बस पक्का करने के लिए — क्या आप अपना product online बेचना चाहेंगे?"
    transitions_on:
      explicit_interest: QUALIFICATION
      already_selling: QUALIFICATION   # still worth qualifying — may want to expand/improve
      not_interested: NOT_INTERESTED
      not_ready: UNCERTAIN
      uncertain: UNCERTAIN

  QUALIFICATION:
    objective: >
      Capture enough information for the human sales team to act on: product/business
      details and willingness to be contacted. PLACEHOLDER — client to supply the exact
      follow-up questions and what counts as "sufficient information."
    mandatory_questions:
      - "What product or products are you looking to sell?"                 # PLACEHOLDER
      - "Would you be open to a follow-up call from our sales team to discuss this further?"
    allowed_tools: [update_lead, create_qualification, schedule_callback, end_call]
    fallback_response:
      en: "Could you tell me a bit more about the product you'd want to sell?"
      hi: "आप कौन सा product बेचना चाहते हैं, उसके बारे में थोड़ा और बताएंगे?"
    # Labels are what the LLM picks as `intent`, so they name what the *customer* did.
    # They were "qualified" / "wants_callback": a "yes" to this state's own question
    # ("open to a follow-up call from our sales team?") is literally wanting a call,
    # and was classified as wants_callback (seen with the local model).
    transitions_on:
      agreed_to_sales_followup: INTERESTED
      busy_call_back_later: CALLBACK
      wants_more_info: UNCERTAIN
      not_interested: NOT_INTERESTED

  OBJECTION_HANDLING:
    objective: >
      Acknowledge a stated objection (e.g. price, timing, skepticism) using only
      information present in product_info — never invent claims.
    allowed_tools: [update_lead, schedule_callback, end_call]
    fallback_response:
      en: "That's a fair point — would it help if our team called to explain further?"
      hi: "आपकी बात सही है — क्या हमारी टीम आपको कॉल करके और समझा दे?"
    transitions_on:
      resolved: QUALIFICATION
      unresolved: UNCERTAIN
      not_interested: NOT_INTERESTED

  INTERESTED:
    objective: "Confirm qualification and close the call positively."
    allowed_tools: [create_qualification, update_lead, end_call]
    fallback_response:
      en: "Great — thank you, our team will be in touch shortly."
      hi: "बहुत बढ़िया — धन्यवाद, हमारी टीम जल्द ही आपसे बात करेगी।"
    transitions_on:
      done: END

  CALLBACK:
    objective: "Confirm a specific callback time."
    mandatory_questions:
      - "What day and time works best for a follow-up call?"
    allowed_tools: [schedule_callback, end_call]
    fallback_response:
      en: "No problem, when would be a better time to reach you?"
      hi: "कोई बात नहीं, आपसे बात करने का सही समय कब रहेगा?"
    transitions_on:
      scheduled: END

  NOT_INTERESTED:
    objective: "Politely close the call. Optionally record a reason if offered."
    allowed_tools: [update_lead, end_call]
    fallback_response:
      en: "Understood, thank you for your time."
      hi: "समझ गई, आपके समय के लिए धन्यवाद।"
    transitions_on:
      done: END

  DO_NOT_CALL:
    objective: "Confirm the DNC request, apologize, and end the call immediately."
    mandatory_questions: []
    allowed_tools: [mark_dnc, end_call]
    fallback_response:
      en: "Understood — we won't call again. Apologies for the disturbance."
      hi: "समझ गई — हम आपको दोबारा कॉल नहीं करेंगे। परेशानी के लिए माफ़ी।"
    transitions_on:
      done: END

  UNCERTAIN:
    objective: >
      Low-confidence outcome. Do not force a yes/no. Offer a follow-up path and let a
      human review the call.
    allowed_tools: [update_lead, schedule_callback, create_qualification, end_call]
    fallback_response:
      en: "That's okay — would it be alright if our team followed up by call or message?"
      hi: "कोई बात नहीं — क्या हमारी टीम आपसे कॉल या मैसेज से बात कर सकती है?"
    transitions_on:
      done: END

  WRONG_NUMBER:
    objective: "Confirm wrong number/person and end the call."
    allowed_tools: [update_lead, end_call]
    fallback_response:
      en: "Apologies for the confusion, have a good day."
      hi: "गलतफ़हमी के लिए माफ़ी, आपका दिन शुभ हो।"
    transitions_on:
      done: END

  END:
    objective: "Terminal state."
    allowed_tools: []

# Deterministic do-not-call backstop (CLAUDE.md rule 3: DNC always wins). If the
# customer's words match any of these (case-insensitive regular expressions), the
# application records DNC itself, says DO_NOT_CALL's fallback_response, and ends the
# call — without asking the LLM, which may forget to call mark_dnc (seen with small
# local models). Kept specific on purpose: "don't call me now, call me later" must
# NOT match.
#
# With the LOCAL LLM backend these phrases are the only way a call reaches
# DO_NOT_CALL: small local models were seen proposing DNC for customers who wanted a
# call back, so their DNC guesses are refused (orchestrator/engine.py). Keep this list
# broad enough to catch real requests in the words customers actually use.
dnc_phrases:
  - '\b(stop|quit) (calling|ringing|phoning|contacting|bothering|messaging|texting|harass\w*)\b'
  - '\bdo ?n[o''`’]?t (ever )?(call|ring|phone|message|text) (me|us|this number|here)( ever)? (again|anymore|any more)\b'
  - '\bdo ?n[o''`’]?t (ever )?(contact|bother|harass) (me|us)\b'
  - '\bnever (call|ring|phone|contact) (me|us|this number|here|again)\b'
  - '\b(remove|delete|take|strike) (me|us|my number|our number|this number|my name)( off| from| out of)? (your|the|this|all) (list|lists|database|records|calling list)\b'
  - '\b(do[- ]?not[- ]?call|don''t call|dnc|dnd) (list|registry|register)\b'
  - '\b(unsubscribe|opt me out|opt out of (these|your) calls)\b'
  - '\b(i|we) (do ?n[o''`’]?t|never) want (any )?(more )?(calls|to be called|you to call)\b(?! (right )?now| today| at the moment| this (week|month))'
  # Hindi / Hinglish (language_policy: match_customer). "dobara/kabhi ... mat" = "again/
  # ever ... don't"; a bare "call mat karo" is NOT here — "abhi call mat karo, baad mein
  # karna" means "don't call now, call later".
  - '\b(dobara|dubara|phir se|fir se|kabhi bhi|kabhi)\s+(call|phone|fone|kol)\s+(mat|na|nahi|nahin)\b'
  - '\b(mera|hamara)\s+(number|no)\s+(hata|hatao|hata do|delete|remove)'
  - '\blist\s+se\s+(hata|hatao|nikal|nikalo|remove)'
  - '(दोबारा|दुबारा|फिर से|कभी भी|कभी)\s*(कॉल|काल|फोन|फ़ोन)\s*(मत|ना|नहीं)'
  - '(मेरा|हमारा)\s*(नंबर|नम्बर)\s*(हटा|हटाओ|डिलीट)'
  - '(लिस्ट|सूची)\s*से\s*(हटा|हटाओ|निकाल)'

# Said as soon as the customer's words are recognized (~0.7 s after they stop) — recorded once in advance, so it plays
# with no delay — while the real reply is prepared (2-3 s of network round trips).
# Rotated, in the customer's language (language_policy). Remove to turn off.
# PLACEHOLDER wording — client to confirm.
acknowledgments:
  en: ["Hmm.", "I see.", "Right."]
  hi: ["जी।", "अच्छा।", "हम्म।"]

# States that mean "the lead agreed to talk to the sales team". A call that reached
# any of them is marked "Interested" in the call log (exports/call_log.xlsx, see
# workers/call_log.py) — decided from the state machine's record, not from anything
# the LLM asserts.
sales_followup_states: [INTERESTED]
# States that mean the lead declined — "Not interested" in the call log.
not_interested_states: [NOT_INTERESTED]

max_call_duration_seconds: 420   # PLACEHOLDER — confirm with client
retry_limits:
  per_question: 2
  per_state: 3

qualification_ref: config/qualification/rules.yaml
